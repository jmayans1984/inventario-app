<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos Bancarios - Tesorería</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER UNIVERSAL -->
    <header class="header">
        <div class="header-info">
            <div class="user-info">
                <span class="user-name" id="userName">👤 Usuario</span>
                <span class="empresa-info">| 🏢 <span id="empresaCode">-</span></span>
            </div>
            <div class="theme-switch-container">
                <span class="theme-label">🌙</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-label">☀️</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="window.location.href='principal.html'">
                🏠 Inicio
            </button>
            <button class="btn-header" onclick="cerrarSesion()">
                🚪 Salir
            </button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <div style="max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">
        <h1 style="margin-bottom: 2rem; color: var(--text-primary);">🏦 Movimientos bancarios</h1>

        <div class="table-container">
            <div id="movimientosContent"></div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="tesoreria-movimientos.js"></script>
</body>
</html>
