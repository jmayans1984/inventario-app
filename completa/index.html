  </head>
  <body>
    <div id="app"></div>
    <script>
      (function(){
        var v='2.2';
        if(localStorage.getItem('_appv')!==v){
          fetch(location.href,{cache:'no-store'}).then(function(r){return r.text()}).then(function(html){
            if(html.indexOf('content="'+v+'"')<0)return;
            localStorage.setItem('_appv',v);
            location.reload(true);
          });
        }
      })();
    </script>
  </body>
