name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'inventario-vue/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: inventario-vue
        run: npm install

      - name: Build
        working-directory: inventario-vue
        run: npm run build

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add completa/
          git diff --staged --quiet || git commit -m "chore: auto-build completa/ [skip ci]"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
