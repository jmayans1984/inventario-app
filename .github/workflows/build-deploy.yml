name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'completa/**'
      - 'light/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages
        run: git push -f origin HEAD:gh-pages
