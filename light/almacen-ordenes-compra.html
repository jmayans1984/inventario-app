<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Órdenes de Compra - Almacén</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Modal full-screen móvil */
        .oc-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: var(--bg-secondary);
            flex-direction: column;
        }
        .oc-modal.open { display: flex; }
        .oc-modal-header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }
        .oc-modal-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .oc-modal-footer {
            flex-shrink: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        }
        .oc-estado-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1.5px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .oc-estado-chip.active { border-color: #10b981; background: rgba(16,185,129,.1); color: #10b981; }

        /* Grid de productos */
        .oc-prod-grid-head {
            display: grid;
            grid-template-columns: 60px 1fr 40px 80px 70px;
            gap: 0;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-tertiary);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }
        .oc-prod-grid-body {
            display: contents;
        }
        .oc-prod-row {
            display: grid;
            grid-template-columns: 60px 1fr 40px 80px 70px;
            gap: 0;
            align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-primary);
        }
        .oc-prod-row.active { background: rgba(16,185,129,.04); }
        .oc-prod-col { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .oc-prod-col-codigo { font-weight: 700; color: #10b981; font-family: monospace; font-size: 11px; }
        .oc-prod-col-nombre { font-size: 12px; font-weight: 600; }
        .oc-prod-col-desc { font-size: 10px; color: var(--text-tertiary); white-space: normal; }
        .oc-prod-col-und { text-align: center; font-size: 10px; color: var(--text-tertiary); }
        .oc-prod-col-precio { text-align: right; font-size: 11px; color: #10b981; font-weight: 600; font-family: monospace; }
        .oc-cant-input {
            width: 70px;
            height: 24px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin: 0 auto;
            display: block;
            padding: 0 6px;
            outline: none;
        }
        .oc-cant-input.active { border-color: #10b981; background: rgba(16,185,129,.08); color: #10b981; }
        .oc-cant-input.warn { border-color: #f59e0b; background: rgba(245,158,11,.1); color: #b45309; }
        .oc-cant-input:focus { border-color: #10b981; }
    </style>
    <meta name="permiso" content="/almacen/procesos/ordenes-compra">
</head>
<body>
    <header class="header"></header>

    <div class="mod-hero" style="background:linear-gradient(135deg,#10b981,#059669)">
        <span class="mod-hero-icon">🛒</span>
        <div class="mod-hero-title">Órdenes de Compra</div>
        <div class="mod-hero-sub">Solicitudes y seguimiento de pedidos</div>
    </div>

    <div class="page-wrapper">
        <div id="ocContent"></div>
    </div>

    <!-- Modal nueva/editar orden -->
    <div class="oc-modal" id="ocModal">
        <div class="oc-modal-header">
            <div style="min-width:0">
                <div id="ocModalTitle" style="font-size:15px;font-weight:800">NUEVA ORDEN</div>
                <div id="ocModalSub" style="font-size:11px;opacity:.8"></div>
            </div>
            <div style="text-align:right;flex-shrink:0">
                <div style="font-size:9px;opacity:.7">TOTAL</div>
                <div id="ocModalTotal" style="font-size:16px;font-weight:800">$0.00</div>
            </div>
            <button onclick="cerrarModalOrden()" style="background:rgba(255,255,255,.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:16px;flex-shrink:0">✕</button>
        </div>
        <div style="padding:10px 14px;background:var(--bg-primary);border-bottom:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
            <input type="text" id="ocBusqueda" placeholder="🔍 Buscar producto..." oninput="renderGridProductos()"
                style="flex:1;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--bg-secondary);color:var(--text-primary)">
            <select id="ocFiltroGrupo" onchange="renderGridProductos()"
                style="width:120px;height:40px;padding:0 8px;border:1px solid var(--border);border-radius:10px;font-size:13px;background:var(--bg-secondary);color:var(--text-primary)">
                <option value="">Grupos</option>
            </select>
        </div>
        <div class="oc-modal-body" id="ocGridProductos"></div>
        <div class="oc-modal-footer">
            <div id="ocAlertaStock" style="display:none;font-size:11px;color:#f59e0b;padding-bottom:8px">⚠️ Hay productos que superan el stock disponible. Se agregará una observación automática.</div>
            <div style="display:flex;gap:8px;margin-bottom:8px">
                <div style="flex:1">
                    <label style="font-size:10px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase">Fecha entrega *</label>
                    <input type="date" id="ocFechaEntrega" style="width:100%;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg-secondary);color:var(--text-primary)">
                </div>
                <div style="flex:1.4">
                    <label style="font-size:10px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase">Observaciones</label>
                    <input type="text" id="ocObservaciones" maxlength="200" placeholder="Notas..." style="width:100%;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg-secondary);color:var(--text-primary)">
                </div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                <span id="ocItemsResumen" style="font-size:12px;color:var(--text-secondary);flex:1"></span>
                <button class="btn btn-primary" id="ocBtnEnviar" style="background:#10b981;padding:10px 18px" onclick="enviarOrden()">📤 Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal detalle -->
    <div class="oc-modal" id="ocModalDetalle">
        <div class="oc-modal-header" style="background:linear-gradient(135deg,#0c2340,#1a3a6e)">
            <div style="min-width:0">
                <div id="ocDetTitle" style="font-size:15px;font-weight:800"></div>
                <div id="ocDetSub" style="font-size:11px;opacity:.8"></div>
            </div>
            <button onclick="document.getElementById('ocModalDetalle').classList.remove('open')" style="background:rgba(255,255,255,.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:16px;flex-shrink:0">✕</button>
        </div>
        <div class="oc-modal-body" id="ocDetBody" style="padding:14px"></div>
    </div>

    <!-- Modal imagen ampliada -->
    <div class="oc-modal" id="ocModalImagen" style="background:rgba(0,0,0,.95);align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)">
        <div style="position:absolute;top:14px;right:14px;z-index:10">
            <button onclick="document.getElementById('ocModalImagen').classList.remove('open')" style="background:#ef4444;border:none;color:white;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:700">✕</button>
        </div>
        <img id="ocImagenSrc" style="max-width:95%;max-height:90vh;object-fit:contain;display:block">
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
    <script src="almacen-ordenes-compra.js"></script>
</body>
</html>
