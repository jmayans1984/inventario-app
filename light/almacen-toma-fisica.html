<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Toma Física de Inventario - Almacén</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.active { display: flex; }
        .loading-popup {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 280px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .loading-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .popup-state-success {
            display: none;
        }
        .popup-state-success.show {
            display: block;
        }
        .popup-state-loading.hide {
            display: none;
        }
        .success-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            animation: popupBounce 0.6s ease;
        }
        .success-button {
            margin-top: 24px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .success-button:active {
            transform: scale(0.98);
        }
        @keyframes popupBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <!-- HEADER UNIVERSAL -->
    <header class="header">
        <div class="header-info">
            <div class="user-info">
                <span class="user-name" id="userName">👤 Usuario</span>
                <span class="empresa-info">| 🏢 <span id="empresaCode">-</span></span>
            </div>
            <div class="theme-switch-container">
                <span class="theme-label">🌙</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-label">☀️</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="window.location.href='principal.html'">
                🏠 Inicio
            </button>
            <button class="btn-header" onclick="cerrarSesion()">
                🚪 Salir
            </button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
        <h1 style="margin-bottom: 2rem; color: var(--text-primary);">📦 Toma física de inventario</h1>

        <div class="table-container">
            <div id="gestionContent"></div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-popup">
            <div class="popup-state-loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Procesando Conteo</div>
                <div class="loading-subtext">Por favor espera...</div>
            </div>
            <div class="popup-state-success">
                <div class="success-icon">✓</div>
                <div class="loading-text">Conteo Guardado</div>
                <div class="loading-subtext">La información se registró correctamente</div>
                <button class="success-button" onclick="cerrarPopupExito()">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="almacen-toma-fisica.js"></script>
</body>
</html>
