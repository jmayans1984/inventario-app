<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Toma Física de Inventario - Almacén</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.active { display: flex; }
        .loading-popup {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 280px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .loading-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .popup-state-success {
            display: none;
        }
        .popup-state-success.show {
            display: block;
        }
        .popup-state-loading.hide {
            display: none;
        }
        .success-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            animation: popupBounce 0.6s ease;
        }
        .success-button {
            margin-top: 24px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .success-button:active {
            transform: scale(0.98);
        }
        @keyframes popupBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        /* ── Bottom sheet visualización ─────────────────────── */
        .bs-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:flex-end; }
        .bs-overlay.open { display:flex; }
        .bs-panel { background:var(--bg-primary); border-radius:20px 20px 0 0; width:100%; max-height:80vh; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom); animation:bsSlideUp .22s ease; }
        @keyframes bsSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

    </style>
    <meta name="permiso" content="/almacen/procesos/toma-fisica">
</head>
<body>
    <header class="header"></header>

    <div class="mod-hero" style="background:linear-gradient(135deg,#3b82f6,#2563eb)">
        <span class="mod-hero-icon">📦</span>
        <div class="mod-hero-title">Toma Física de Inventario</div>
        <div class="mod-hero-sub">Conteo y ajuste de stock</div>
    </div>

    <div class="page-wrapper">
        <div class="table-container">
            <div id="gestionContent"></div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-popup">
            <div class="popup-state-loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Procesando Conteo</div>
                <div class="loading-subtext">Por favor espera...</div>
            </div>
            <div class="popup-state-success">
                <div class="success-icon">✓</div>
                <div class="loading-text">Conteo Guardado</div>
                <div class="loading-subtext">La información se registró correctamente</div>
                <button class="success-button" onclick="cerrarPopupExito()">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM SHEET — método de visualización -->
    <div id="bsOverlay" class="bs-overlay" onclick="cerrarBsOverlay(event)">
        <div class="bs-panel">
            <!-- contenido inyectado por JS -->
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
    <!-- ?v= fuerza la recarga en celulares que tengan cacheada la versión anterior -->
    <script src="almacen-toma-fisica.js?v=20260731-cierre"></script>
</body>
</html>
