<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inicio - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding-top: env(safe-area-inset-top, 0px);
        }

        .home-content {
            padding: 12px 16px 24px;
        }

        /* ── NUEVO HEADER MINIMALISTA ── */
        .home-hero {
            background: #111111 !important;
            border: 1px solid rgba(245,166,35,0.15) !important;
            border-radius: 16px !important;
            padding: 14px 16px !important;
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            color: #ffffff !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .home-hero::before {
            display: none !important;
        }

        .home-hero-logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .home-hero-info {
            flex: 1;
            min-width: 0;
        }

        .home-hero-greeting {
            font-size: 11px !important;
            font-weight: 500 !important;
            color: rgba(255,255,255,0.4) !important;
            opacity: 1 !important;
            margin-bottom: 1px !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
        }

        .home-hero-name {
            font-size: 17px !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            letter-spacing: -0.3px !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .home-hero-empresa {
            font-size: 11px !important;
            color: #F5A623 !important;
            opacity: 1 !important;
            margin-top: 2px !important;
            display: flex !important;
            align-items: center !important;
            gap: 4px !important;
        }

        .home-hero-actions {
            display: flex;
            gap: 8px;
            position: static !important;
            flex-shrink: 0;
        }

        .home-logout-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(239,68,68,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .home-logout-btn svg { display: block; }
        .home-logout-btn:active { background: rgba(239,68,68,0.3); }

        .home-theme-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .home-theme-btn:active { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="home-content">
        <!-- Hero card -->
        <div class="home-hero" id="homeHero">
            <img src="../assets/logo.png" class="home-hero-logo" alt="Logo">
            <div class="home-hero-info">
                <div class="home-hero-greeting">Bienvenido</div>
                <div class="home-hero-name" id="greetingName">Usuario</div>
                <div class="home-hero-empresa">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span id="empresaNombre">—</span>
                </div>
            </div>
            <div class="home-hero-actions">
                <button class="home-theme-btn" onclick="cambiarTema()" aria-label="Cambiar tema">
                    <span class="theme-icon-light">☀️</span>
                    <span class="theme-icon-dark">🌙</span>
                </button>
                <button class="home-theme-btn" onclick="abrirPerfilEmail()" aria-label="Mi correo" title="Configurar correo de alertas">
                    ✉️
                </button>
                <button class="home-logout-btn" onclick="cerrarSesion()" aria-label="Salir">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Modules -->
        <div class="modules-grid" id="modulesGrid" style="margin-top:24px;">
            <a class="module-card" href="contabilidad.html">
                <div class="module-icon module-icon-contabilidad">📊</div>
                <span class="module-label">Contabilidad</span>
            </a>

            <a class="module-card" href="tesoreria.html">
                <div class="module-icon module-icon-tesoreria">💰</div>
                <span class="module-label">Tesorería</span>
            </a>

            <a class="module-card" href="almacen.html">
                <div class="module-icon module-icon-almacen">📦</div>
                <span class="module-label">Almacén</span>
            </a>

            <a class="module-card" href="nomina.html">
                <div class="module-icon module-icon-nomina">👥</div>
                <span class="module-label">Nómina</span>
            </a>

            <a class="module-card" href="facturacion.html">
                <div class="module-icon module-icon-facturacion">🧾</div>
                <span class="module-label">Facturación</span>
            </a>
        </div>
    </div>

    <!-- Modal: configurar correo de alertas -->
    <div id="perfilEmailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;align-items:flex-end;justify-content:center">
        <div style="background:var(--bg-primary);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px 20px calc(24px + env(safe-area-inset-bottom, 0px))">
            <div style="font-size:16px;font-weight:800;color:var(--text-primary);margin-bottom:4px">✉️ Mi correo de alertas</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:20px">Recibirás un email a las 8 PM con los productos bajo stock mínimo</div>

            <label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-tertiary);display:block;margin-bottom:6px">Correo electrónico</label>
            <input type="email" id="perfilEmailInput"
                placeholder="tucorreo@gmail.com"
                style="width:100%;height:46px;padding:0 14px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;background:var(--bg-secondary);color:var(--text-primary);box-sizing:border-box;outline:none">

            <div id="perfilEmailMsg" style="display:none;font-size:12px;margin-top:8px;padding:8px 12px;border-radius:8px"></div>

            <div style="display:flex;gap:10px;margin-top:18px">
                <button onclick="cerrarPerfilEmail()" style="flex:1;height:44px;border:1.5px solid var(--border);border-radius:12px;background:transparent;color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer">Cancelar</button>
                <button onclick="guardarPerfilEmail()" style="flex:2;height:44px;border:none;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;font-size:14px;font-weight:700;cursor:pointer">Guardar correo</button>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script>
        const API_BASE = 'https://inventario-app-production-e8c8.up.railway.app/api';

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!window.sesion) return;

                // Delivery personnel → redirect
                if (window.sesion.nivel === 999) {
                    window.location.href = 'entrega-ordenes.html';
                    return;
                }

                const name = window.sesion.nombre || window.sesion.usuario || '';
                document.getElementById('greetingName').textContent =
                    name.split(' ')[0] || name;
                document.getElementById('empresaNombre').textContent =
                    window.sesion.empresaNombre || '';
            }, 150);
        });

        async function abrirPerfilEmail() {
            const modal = document.getElementById('perfilEmailModal');
            const input = document.getElementById('perfilEmailInput');
            const msg   = document.getElementById('perfilEmailMsg');
            msg.style.display = 'none';
            input.value = '';
            modal.style.display = 'flex';

            // Cargar email actual
            try {
                const usuario = window.sesion?.usuario || JSON.parse(localStorage.getItem('usuario') || '{}').usuario;
                if (!usuario) return;
                const r = await fetch(`${API_BASE}/usuarios/email?usuario=${encodeURIComponent(usuario)}`);
                const d = await r.json();
                if (d.success && d.email) input.value = d.email;
            } catch (e) { /* silencioso */ }
        }

        function cerrarPerfilEmail() {
            document.getElementById('perfilEmailModal').style.display = 'none';
        }

        async function guardarPerfilEmail() {
            const input = document.getElementById('perfilEmailInput');
            const msg   = document.getElementById('perfilEmailMsg');
            const email = input.value.trim();
            const usuario = window.sesion?.usuario || JSON.parse(localStorage.getItem('usuario') || '{}').usuario;

            if (!usuario) return;

            // Validación básica
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                mostrarMsg('error', 'Ingresa un correo válido');
                return;
            }

            try {
                const r = await fetch(`${API_BASE}/usuarios/email`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, email: email || null }),
                });
                const d = await r.json();
                if (d.success) {
                    mostrarMsg('ok', email ? `✅ Correo guardado: ${email}` : '✅ Correo eliminado');
                    setTimeout(cerrarPerfilEmail, 1500);
                } else {
                    mostrarMsg('error', d.error || 'Error al guardar');
                }
            } catch (e) {
                mostrarMsg('error', 'Error de conexión');
            }
        }

        function mostrarMsg(tipo, texto) {
            const msg = document.getElementById('perfilEmailMsg');
            msg.style.display = 'block';
            msg.style.background = tipo === 'ok' ? 'rgba(16,185,129,.12)' : 'rgba(239,68,68,.1)';
            msg.style.color = tipo === 'ok' ? '#10b981' : '#ef4444';
            msg.textContent = texto;
        }

        // Cerrar modal al tocar fondo
        document.getElementById('perfilEmailModal').addEventListener('click', function(e) {
            if (e.target === this) cerrarPerfilEmail();
        });
    </script>
</body>
</html>
