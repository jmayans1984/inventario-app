<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inicio - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding-top: env(safe-area-inset-top, 0px);
        }

        .home-theme-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .home-theme-btn:active { background: rgba(255,255,255,0.25); }

        .home-logout-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .home-logout-btn svg { display: block; }
        .home-logout-btn:active { background: #dc2626; }

        .home-hero-actions {
            display: flex;
            gap: 8px;
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 1;
        }

        .home-content {
            padding: 16px 16px 24px;
        }
    </style>
</head>
<body>
    <div class="home-content">
        <!-- Hero card -->
        <div class="home-hero" id="homeHero">
            <div class="home-hero-actions">
                <button class="home-theme-btn" onclick="cambiarTema()" aria-label="Cambiar tema">
                    <span class="theme-icon-light">☀️</span>
                    <span class="theme-icon-dark">🌙</span>
                </button>
                <button class="home-logout-btn" onclick="cerrarSesion()" aria-label="Salir">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="home-hero-greeting">Bienvenido</div>
            <div class="home-hero-name" id="greetingName">Usuario</div>
            <div class="home-hero-empresa">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                <span id="empresaNombre">—</span>
            </div>
        </div>

        <!-- Modules -->
        <div class="modules-grid" id="modulesGrid" style="margin-top:24px;">
            <a class="module-card" href="contabilidad.html">
                <div class="module-icon module-icon-contabilidad">📊</div>
                <span class="module-label">Contabilidad</span>
            </a>

            <a class="module-card" href="tesoreria.html">
                <div class="module-icon module-icon-tesoreria">💰</div>
                <span class="module-label">Tesorería</span>
            </a>

            <a class="module-card" href="almacen.html">
                <div class="module-icon module-icon-almacen">📦</div>
                <span class="module-label">Almacén</span>
            </a>

            <a class="module-card" href="nomina.html">
                <div class="module-icon module-icon-nomina">👥</div>
                <span class="module-label">Nómina</span>
            </a>

            <a class="module-card" href="facturacion.html">
                <div class="module-icon module-icon-facturacion">🧾</div>
                <span class="module-label">Facturación</span>
            </a>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!window.sesion) return;

                // Delivery personnel → redirect
                if (window.sesion.nivel === 999) {
                    window.location.href = 'entrega-ordenes.html';
                    return;
                }

                const name = window.sesion.nombre || window.sesion.usuario || '';
                document.getElementById('greetingName').textContent =
                    name.split(' ')[0] || name;
                document.getElementById('empresaNombre').textContent =
                    window.sesion.empresaNombre || '';
            }, 150);
        });
    </script>
</body>
</html>
