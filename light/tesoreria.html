<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tesorería - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Oculto hasta que permisos.js confirme el acceso: evita el parpadeo
           de ver el menú completo por una fracción de segundo y que luego
           desaparezcan ítems. */
        [data-permiso] { visibility: hidden; }
    </style>
</head>
<body>
    <!-- Top bar injected by header.js -->

    <!-- Hero -->
    <div class="mod-hero mod-hero-tesoreria">
        <div class="mod-hero-icon">💰</div>
        <div class="mod-hero-title">Tesorería</div>
        <div class="mod-hero-sub">Operaciones bancarias y facturas</div>
    </div>

    <div class="page-content">

        <!-- PROCESOS -->
        <div class="section-label">Procesos</div>
        <div class="section-group">
            <a class="section-item" href="tesoreria-movimientos.html" data-permiso="/tesoreria/procesos/movimientos-bancarios">
                <div class="item-icon icon-amber">🏦</div>
                <div class="item-body">
                    <div class="item-name">Movimientos Bancarios</div>
                    <div class="item-desc">Registrar ingresos y egresos</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="section-item" href="tesoreria-facturas-compra.html" data-permiso="/tesoreria/procesos/facturas-compra">
                <div class="item-icon icon-amber">🧾</div>
                <div class="item-body">
                    <div class="item-name" id="tituloFacturas">Gestión de Facturas de Compra</div>
                    <div class="item-desc">Administrar facturas</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

        <!-- REPORTES -->
        <div class="section-label">Reportes</div>
        <div class="section-group">
            <a class="section-item" href="tesoreria-reporte.html" data-permiso="/tesoreria/reportes/movimiento-cuentas">
                <div class="item-icon icon-amber">📈</div>
                <div class="item-body">
                    <div class="item-name">Movimientos por Cuenta Bancaria</div>
                    <div class="item-desc">Consultar movimientos registrados</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                if (!window.sesion) return;
                try {
                    const response = await fetch(`https://inventario-app-production-e8c8.up.railway.app/api/empresa/tipo?empresa=${window.sesion.empresa}`);
                    const data = await response.json();
                    if (data.success && data.tipo !== 'CLIENTE') {
                        document.getElementById('tituloFacturas').textContent = 'Facturas de Venta';
                    }
                } catch (e) { /* silencioso */ }
            }, 200);
        });
    </script>
</body>
</html>
