<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header"></header>

    <!-- CONTENIDO -->
    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
        <!-- TÍTULO -->
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 700; letter-spacing: 0.05em;">
                MÓDULO DE INVENTARIO
            </h1>
            <p style="color: var(--text-secondary);">Selecciona una opción</p>
        </div>

        <!-- TARJETAS PRINCIPALES -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; max-width: 600px; margin: 0 auto;">

            <div class="menu-item" onclick="window.location.href='inventario-stock.html'">
                <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📦</div>
                <h4>Stock por Centro</h4>
                <p style="font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.8;">Visualizar inventario actual</p>
            </div>

        </div>

    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (!localStorage.getItem('empresaActual') || !localStorage.getItem('usuario')) {
                window.location.href = 'index.html';
                return;
            }
        });
    </script>
</body>
</html>
