<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top bar injected by header.js -->

    <!-- Hero -->
    <div class="mod-hero mod-hero-inventario">
        <div class="mod-hero-icon">📋</div>
        <div class="mod-hero-title">Inventario</div>
        <div class="mod-hero-sub">Stock, gestión y órdenes</div>
    </div>

    <div class="page-content">

        <!-- PROCESOS -->
        <div class="section-label">Procesos</div>
        <div class="section-group">
            <a class="section-item" href="almacen-gestion.html">
                <div class="item-icon icon-red">📝</div>
                <div class="item-body">
                    <div class="item-name">Gestión de Inventario</div>
                    <div class="item-desc">Entradas, salidas y transferencias</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="section-item" href="almacen-toma-fisica.html">
                <div class="item-icon icon-red">📦</div>
                <div class="item-body">
                    <div class="item-name">Toma Física</div>
                    <div class="item-desc">Conteo y verificación de stock</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="section-item" href="almacen-ordenes-compra.html">
                <div class="item-icon icon-red">📋</div>
                <div class="item-body">
                    <div class="item-name">Órdenes de Compra</div>
                    <div class="item-desc">Registrar solicitudes de compra</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

        <!-- INFORMES -->
        <div class="section-label">Informes</div>
        <div class="section-group">
            <a class="section-item" href="inventario-stock.html">
                <div class="item-icon icon-red">📊</div>
                <div class="item-body">
                    <div class="item-name">Stock Actual</div>
                    <div class="item-desc">Visualizar inventario por centro de costo</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

    </div>

    <script src="theme.js"></script>
    <script src="campo-fecha.js"></script>
    <script src="header.js"></script>
</body>
</html>
