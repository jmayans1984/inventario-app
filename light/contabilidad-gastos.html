<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestión de Gastos</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .autocomplete-container {
            position: relative;
        }
        .autocomplete-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .autocomplete-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .autocomplete-dropdown.show {
            display: block;
        }
        .autocomplete-item {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s;
        }
        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background-color: var(--accent);
            color: white;
        }
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .autocomplete-no-results {
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="header"></header>

    <div class="mod-hero" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)">
        <span class="mod-hero-icon">💰</span>
        <div class="mod-hero-title">Gestión de Gastos</div>
        <div class="mod-hero-sub">Registro de egresos contables</div>
    </div>

    <div class="page-wrapper-sm">
        <div class="table-container">
            <form id="formGasto" style="padding:16px">
                <div style="display:grid;gap:1rem;">
                    <!-- Código (automático) -->
                    <div class="form-group">
                        <label class="filter-label">Código *</label>
                        <input type="text" id="codigoGasto" class="filter-input" readonly style="background-color: var(--bg-tertiary); text-transform: uppercase;">
                    </div>

                    <!-- Fecha -->
                    <div class="form-group">
                        <label class="filter-label">Fecha *</label>
                        <input type="date" id="fecha" class="filter-input" required>
                    </div>

                    <!-- Factura -->
                    <div class="form-group">
                        <label class="filter-label">Factura</label>
                        <input type="text" id="factura" class="filter-input" placeholder="Ej: F-12345" style="text-transform: uppercase;" onchange="this.value = this.value.toUpperCase()">
                    </div>

                    <!-- Proveedor -->
                    <div class="form-group">
                        <label class="filter-label">Proveedor *</label>
                        <div class="autocomplete-container">
                            <input type="text" id="proveedorInput" class="autocomplete-input" placeholder="Escriba para buscar..." required>
                            <input type="hidden" id="proveedor" class="filter-select">
                            <div id="proveedorDropdown" class="autocomplete-dropdown"></div>
                        </div>
                    </div>

                    <!-- Centro de Costo -->
                    <div class="form-group">
                        <label class="filter-label">Centro de costo *</label>
                        <div class="autocomplete-container">
                            <input type="text" id="ccostoInput" class="autocomplete-input" placeholder="Escriba para buscar..." required>
                            <input type="hidden" id="ccosto" class="filter-select">
                            <div id="ccostoDropdown" class="autocomplete-dropdown"></div>
                        </div>
                    </div>

                    <!-- Forma de Pago (Cuenta Bancaria) -->
                    <div class="form-group">
                        <label class="filter-label">Forma de pago *</label>
                        <div class="autocomplete-container">
                            <input type="text" id="formaPagoInput" class="autocomplete-input" placeholder="Escriba para buscar..." required>
                            <input type="hidden" id="formaPago" class="filter-select">
                            <div id="formaPagoDropdown" class="autocomplete-dropdown"></div>
                        </div>
                    </div>

                    <!-- Cuenta Contable -->
                    <div class="form-group">
                        <label class="filter-label">Cuenta *</label>
                        <div class="autocomplete-container">
                            <input type="text" id="cuentaInput" class="autocomplete-input" placeholder="Escriba para buscar..." required>
                            <input type="hidden" id="cuenta" class="filter-select">
                            <div id="cuentaDropdown" class="autocomplete-dropdown"></div>
                        </div>
                    </div>

                    <!-- Concepto -->
                    <div class="form-group">
                        <label class="filter-label">Concepto</label>
                        <input type="text" id="concepto" class="filter-input" placeholder="Descripción del gasto" style="text-transform: uppercase;" onchange="this.value = this.value.toUpperCase()">
                    </div>

                    <!-- VR. BASE (Subtotal) -->
                    <div class="form-group">
                        <label class="filter-label">Vr. base *</label>
                        <input type="number" id="subtotal" class="filter-input" step="0.01" required placeholder="0.00" onblur="calcularTotal()">
                    </div>

                    <!-- Impuestos -->
                    <div class="form-group">
                        <label class="filter-label">Impuestos</label>
                        <input type="number" id="impuestos" class="filter-input" step="0.01" placeholder="0.00" onblur="calcularTotal()">
                    </div>

                    <!-- Total (calculado) -->
                    <div class="form-group">
                        <label class="filter-label">Total *</label>
                        <input type="number" id="total" class="filter-input" step="0.01" required readonly style="background-color: var(--bg-tertiary); font-weight: 600; font-size: 1.2rem;">
                    </div>
                </div>

                <!-- Botones -->
                <div style="display:flex;gap:1rem;margin-top:1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='contabilidad.html'" style="flex: 1;">
                        ❌ Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        💾 Guardar Gasto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="contabilidad-gastos.js"></script>
</body>
</html>
