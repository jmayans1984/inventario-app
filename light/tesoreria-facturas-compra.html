<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestión de Facturas de Compra - Tesorería</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="permiso" content="/tesoreria/procesos/facturas-compra">
</head>
<body>
    <header class="header"></header>

    <div class="mod-hero" style="background:linear-gradient(135deg,#10b981,#059669)">
        <span class="mod-hero-icon">🧾</span>
        <div class="mod-hero-title">Facturas de Compra</div>
        <div class="mod-hero-sub">Registro y gestión de facturas</div>
    </div>

    <div class="page-wrapper-sm">
        <div class="table-container">
            <div id="facturasCompraContent"></div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="campo-fecha.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
    <script src="tesoreria-facturas-compra.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (!window.sesion) {
                window.location.href = 'index.html';
                return;
            }

            setTimeout(() => {
                if (typeof cargarFacturasCompra === 'function') {
                    cargarFacturasCompra();
                }
            }, 100);
        });
    </script>
</body>
</html>
