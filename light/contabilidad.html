<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contabilidad - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Oculto hasta que permisos.js confirme el acceso: evita el parpadeo
           de ver el menú completo por una fracción de segundo y que luego
           desaparezcan ítems. */
        [data-permiso] { visibility: hidden; }
    </style>
</head>
<body>
    <!-- Top bar injected by header.js -->

    <!-- Hero -->
    <div class="mod-hero mod-hero-contabilidad">
        <div class="mod-hero-icon">📊</div>
        <div class="mod-hero-title">Contabilidad</div>
        <div class="mod-hero-sub">Operaciones y reportes contables</div>
    </div>

    <div class="page-content">

        <!-- PROCESOS -->
        <div class="section-label">Procesos</div>
        <div class="section-group">
            <a class="section-item" href="contabilidad-gastos.html" data-permiso="/contabilidad/procesos/gastos">
                <div class="item-icon icon-green"><i data-icono="recibo"></i></div>
                <div class="item-body">
                    <div class="item-name">Gestión de Gastos</div>
                    <div class="item-desc">Registrar y administrar gastos</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

        <!-- REPORTES -->
        <div class="section-label">Reportes</div>
        <div class="section-group">
            <a class="section-item" href="contabilidad-reportes.html" data-permiso="/contabilidad/reportes/gastos">
                <div class="item-icon icon-green"><i data-icono="grafico"></i></div>
                <div class="item-body">
                    <div class="item-name">Reporte de Gastos</div>
                    <div class="item-desc">Consultar gastos registrados</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

    </div>

    <script src="iconos.js"></script>
    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
</body>
</html>
