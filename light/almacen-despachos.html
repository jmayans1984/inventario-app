<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Despachos de Bodega</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Pantallas ─────────────────────────────────────────── */
        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Lista de órdenes ──────────────────────────────────── */
        .filtro-fecha { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .filtro-fecha input[type=date] {
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            flex: 1;
        }
        .orden-card {
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform .1s;
            position: relative;
            overflow: hidden;
        }
        .orden-card:active { transform: scale(.98); }
        .orden-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--est-color);
        }
        .orden-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .orden-id    { font-size: 12px; color: var(--text-tertiary); font-family: monospace; }
        .orden-dest  { font-size: 16px; font-weight: 700; margin: 4px 0; }
        .orden-meta  { font-size: 12px; color: var(--text-secondary); }
        .estado-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .est-PENDIENTE  { background: rgba(245,158,11,.15); color: #f59e0b; --est-color: #f59e0b; }
        .est-EN_PICKING { background: rgba(59,130,246,.15);  color: #3b82f6; --est-color: #3b82f6; }
        .est-EN_PACKING { background: rgba(139,92,246,.15);  color: #8b5cf6; --est-color: #8b5cf6; }
        .est-COMPLETADO { background: rgba(16,185,129,.15);  color: #10b981; --est-color: #10b981; }
        .est-CANCELADO  { background: rgba(107,114,128,.15); color: #6b7280; --est-color: #6b7280; }

        /* ── Detalle de orden ──────────────────────────────────── */
        .det-header-band {
            background: linear-gradient(135deg, #047857, #10b981);
            border-radius: 14px;
            padding: 16px;
            color: white;
            margin-bottom: 16px;
        }
        .det-header-band h2 { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
        .det-header-band p  { font-size: 13px; opacity: .85; margin: 0; }

        .det-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
        .det-table thead th {
            padding: 8px 10px;
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-color);
        }
        .det-table tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .det-table tbody tr.row-ok    { background: rgba(16,185,129,.05); }
        .det-table tbody tr.row-falta { background: rgba(239,68,68,.06); }
        .det-table tbody tr.row-sobre { background: rgba(245,158,11,.06); }
        .prod-nombre { font-weight: 600; font-size: 13px; }
        .prod-cod    { font-size: 11px; color: var(--text-tertiary); font-family: monospace; }
        .num-cell    { text-align: center; font-family: monospace; font-size: 14px; font-weight: 600; }
        .dif-ok    { color: #10b981; font-weight: 700; }
        .dif-falta { color: #ef4444; font-weight: 700; }
        .dif-sobre { color: #f59e0b; font-weight: 700; }

        .btn-accion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity .15s;
        }
        .btn-accion:active { opacity: .8; }
        .btn-picking  { background: #3b82f6; color: white; }
        .btn-packing  { background: #8b5cf6; color: white; }
        .btn-confirmar{ background: #10b981; color: white; }
        .btn-secondary-act { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); }

        /* ── Pantalla de Escaneo ────────────────────────────────── */
        .scan-header {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .scan-header.packing { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
        .scan-icon { font-size: 2rem; flex-shrink: 0; }
        .scan-header h2 { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
        .scan-header p  { font-size: 12px; opacity: .85; margin: 0; }

        /* Input de scanner: captura chars del dispositivo BT */
        .scan-input-wrap {
            position: relative;
            margin-bottom: 14px;
        }
        #scannerInput {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #3b82f6;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 18px;
            font-family: monospace;
            letter-spacing: 2px;
            box-sizing: border-box;
            outline: none;
        }
        #scannerInput.packing-mode { border-color: #8b5cf6; }
        #scannerInput::placeholder { color: var(--text-tertiary); font-size: 14px; letter-spacing: 0; font-family: inherit; }

        .scan-feedback {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .scan-feedback.ok    { display: flex; background: rgba(16,185,129,.15); color: #10b981; border: 1px solid rgba(16,185,129,.3); }
        .scan-feedback.error { display: flex; background: rgba(239,68,68,.12);  color: #ef4444; border: 1px solid rgba(239,68,68,.3);  }
        .scan-feedback.warn  { display: flex; background: rgba(245,158,11,.12); color: #d97706; border: 1px solid rgba(245,158,11,.3);  }

        .scan-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 80px; }
        .scan-item {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }
        .scan-item.item-ok    { border-color: rgba(16,185,129,.4);  background: rgba(16,185,129,.05); }
        .scan-item.item-falta { border-color: rgba(239,68,68,.3);   background: rgba(239,68,68,.04); }
        .scan-item.item-sobre { border-color: rgba(245,158,11,.3);  background: rgba(245,158,11,.04); }
        .scan-item-name { font-weight: 600; font-size: 14px; }
        .scan-item-cod  { font-size: 11px; color: var(--text-tertiary); font-family: monospace; margin-top: 2px; }
        .scan-counter {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        .scan-count-val { font-size: 22px; font-weight: 800; line-height: 1; }
        .scan-count-req { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
        .scan-status-icon { font-size: 18px; display: block; margin-top: 4px; }

        /* Bottom sticky bar en escaneo */
        .scan-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .scan-bottom-bar button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn-finalizar { background: #047857; color: white; }
        .btn-cancelar-scan { background: var(--bg-card); border: 1px solid var(--border-color) !important; color: var(--text-primary); }

        /* ── Confirmación ───────────────────────────────────────── */
        .confirm-section { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); padding: 16px; margin-bottom: 14px; }
        .confirm-title   { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary); margin-bottom: 10px; }
        .diff-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .diff-item:last-child { border-bottom: none; }
        .diff-nombre { font-weight: 500; }
        .diff-nums   { font-family: monospace; font-size: 12px; color: var(--text-secondary); }

        /* ── Impresión ──────────────────────────────────────────── */
        @media print {
            .no-print  { display: none !important; }
            .scan-bottom-bar { display: none !important; }
            body { background: white; color: black; }
            .print-report { display: block !important; }
        }
        .print-report { display: none; }

        /* ── Asociador de barcode (bottom sheet) ────────────────── */
        .bs-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 200;
            align-items: flex-end;
        }
        .bs-overlay.open { display: flex; }
        .bs-panel {
            background: var(--bg-primary);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
            animation: slideUp .22s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        .bs-header {
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .bs-drag { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 auto 14px; }
        .bs-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
        .bs-barcode { font-family: monospace; font-size: 13px; color: #3b82f6; background: rgba(59,130,246,.1); border-radius: 6px; padding: 4px 8px; display: inline-block; }
        .bs-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .bs-list { overflow-y: auto; flex: 1; padding: 8px 0; }
        .bs-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background .1s;
        }
        .bs-item:active { background: var(--bg-card); }
        .bs-item:last-child { border-bottom: none; }
        .bs-item-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(16,185,129,.12); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .bs-item-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .bs-item-cod  { font-size: 11px; font-family: monospace; color: var(--text-tertiary); margin-top: 2px; }
        .bs-item-qty  { margin-left: auto; text-align: right; flex-shrink: 0; }
        .bs-item-qty-val { font-size: 15px; font-weight: 700; color: var(--text-secondary); }
        .bs-item-qty-lbl { font-size: 10px; color: var(--text-tertiary); }
        .bs-footer { padding: 12px 16px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .bs-cancel { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-secondary); font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-factor { flex: 1; padding: 12px 6px; border-radius: 10px; border: 1.5px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }

        /* Botón cámara junto al input */
        .scan-input-wrap { display: flex; gap: 8px; align-items: center; }
        .scan-input-wrap #scannerInput { flex: 1; }
        .btn-camara { flex-shrink: 0; width: 52px; height: 52px; border-radius: 12px; border: 2px solid #3b82f6; background: var(--bg-card); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Overlay cámara fullscreen */
        #camaraOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; }
        #camaraOverlay.activo { display: flex; }
        #camaraVideo { width: 100%; height: 100%; object-fit: cover; }
        .camara-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .camara-mira { width: 260px; height: 160px; border: 3px solid #10b981; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); }
        .camara-hint { margin-top: 20px; color: white; font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
        .camara-top-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px; pointer-events: all; background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); }
        .camara-titulo { color: white; font-size: 15px; font-weight: 700; }
        .btn-cerrar-camara { padding: 8px 16px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,.6); background: rgba(0,0,0,.4); color: white; font-size: 14px; font-weight: 700; cursor: pointer; }
        .camara-feedback { position: absolute; bottom: 40px; left: 20px; right: 20px; padding: 14px; border-radius: 12px; background: rgba(0,0,0,.7); color: white; font-size: 14px; font-weight: 600; text-align: center; display: none; }

        /* ── Utilidades ─────────────────────────────────────────── */
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-tertiary); }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 10px; }
        .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary); margin: 16px 0 10px; }
    </style>
</head>
<body>
    <header class="header"></header>

    <div class="container" style="padding-bottom: 30px;">

        <!-- ══════════════════════════════════════════════════ -->
        <!-- PANTALLA 1: LISTA DE ÓRDENES                       -->
        <!-- ══════════════════════════════════════════════════ -->
        <div id="screen-lista" class="screen active">
            <div class="filtro-fecha">
                <input type="date" id="filtrFecha" onchange="cargarOrdenes()" />
                <button class="btn btn-secondary" onclick="document.getElementById('filtrFecha').value=hoy();cargarOrdenes()">Hoy</button>
            </div>
            <div id="listaOrdenes">
                <div class="empty-state"><div class="empty-icon">⏳</div><p>Cargando...</p></div>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════ -->
        <!-- PANTALLA 2: DETALLE DE ORDEN                       -->
        <!-- ══════════════════════════════════════════════════ -->
        <div id="screen-detalle" class="screen">
            <div id="detalleContenido"></div>
        </div>

        <!-- ══════════════════════════════════════════════════ -->
        <!-- PANTALLA 3: ESCANEO (PICKING O PACKING)            -->
        <!-- ══════════════════════════════════════════════════ -->
        <div id="screen-escaneo" class="screen">
            <div id="scanHeader"></div>

            <!-- Input principal del scanner -->
            <div class="scan-input-wrap">
                <input type="text" id="scannerInput"
                    placeholder="📡 Escanea o toca aquí para escribir el código..."
                    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                    inputmode="numeric"
                    onkeydown="onScanKeydown(event)"
                    onclick="this.select()" />
                <button class="btn-camara" onclick="abrirCamara()" title="Usar cámara">
                    📷
                </button>
            </div>

            <!-- Feedback del último scan -->
            <div id="scanFeedback" class="scan-feedback"></div>

            <!-- Lista de productos con contadores -->
            <div class="section-title">PRODUCTOS DE LA ORDEN</div>
            <div id="scanList" class="scan-list"></div>

            <!-- Barra inferior fija -->
            <div class="scan-bottom-bar no-print">
                <button class="btn-cancelar-scan" onclick="volverAlDetalle()">✕ Cancelar</button>
                <button class="btn-finalizar" onclick="finalizarEscaneo()">✓ Finalizar Escaneo</button>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════ -->
        <!-- PANTALLA 4: CONFIRMACIÓN + REPORTE                 -->
        <!-- ══════════════════════════════════════════════════ -->
        <div id="screen-confirmacion" class="screen">
            <div id="confirmContenido"></div>

            <!-- Sección imprimible -->
            <div id="printArea" class="print-report"></div>
        </div>

    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- BOTTOM SHEET: ASOCIAR BARCODE A PRODUCTO           -->
    <!-- ══════════════════════════════════════════════════ -->
    <div id="bsOverlay" class="bs-overlay" onclick="cerrarAsociador(event)">
        <div class="bs-panel" onclick="event.stopPropagation()">
            <div class="bs-header">
                <div class="bs-drag"></div>
                <div class="bs-title">📡 Código no reconocido</div>
                <div><span class="bs-barcode" id="bsBarcode"></span></div>
                <div class="bs-subtitle">Selecciona el producto para asociar este código de barras</div>
            </div>
            <div class="bs-list" id="bsList"></div>
            <div class="bs-footer">
                <button class="bs-cancel" onclick="cerrarAsociador()">Cancelar — ignorar este escaneo</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- OVERLAY CÁMARA BARCODE                             -->
    <!-- ══════════════════════════════════════════════════ -->
    <div id="camaraOverlay">
        <video id="camaraVideo" autoplay muted playsinline></video>
        <div class="camara-ui">
            <div class="camara-mira"></div>
            <div class="camara-hint">Apunta al código de barras</div>
        </div>
        <div class="camara-top-bar">
            <span class="camara-titulo">📷 Escáner de cámara</span>
            <button class="btn-cerrar-camara" onclick="cerrarCamara()">✕ Cerrar</button>
        </div>
        <div id="camaraFeedback" class="camara-feedback"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script src="theme.js"></script>
    <script src="header.js"></script>
    <script src="almacen-despachos.js"></script>
</body>
</html>
