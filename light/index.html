<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario App - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.6s ease both;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo-img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin: 0 auto 18px;
            display: block;
            filter: drop-shadow(0 8px 20px rgba(245,166,35,0.25));
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-input {
            height: 48px;
            padding: 0 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #1e293b;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }

        .form-input:focus {
            outline: none;
            border-color: #F5A623;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.12);
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .login-options-label {
            font-size: 12px;
            font-weight: 500;
            color: #475569;
        }

        .theme-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .theme-switch input {
            display: none;
        }

        .theme-slider {
            width: 44px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 12px;
            position: relative;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            padding: 0 2px;
        }

        .theme-switch input:checked + .theme-slider {
            background: #F5A623;
        }

        .theme-slider::after {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .theme-switch input:checked + .theme-slider::after {
            transform: translateX(20px);
        }

        .btn-login {
            height: 48px;
            background: linear-gradient(135deg, #F5A623, #E09217);
            color: #111;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            box-shadow: 0 8px 20px rgba(245, 166, 35, 0.35);
        }

        .btn-login:active {
            background: linear-gradient(135deg, #E09217, #c97e0f);
            transform: scale(0.98);
        }

        .login-error {
            display: none;
            padding: 12px 14px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            border: 1px solid #fecaca;
        }

        #empresaSelector {
            display: none;
            margin-bottom: 18px;
        }

        .empresa-selector-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: block;
        }

        .empresa-option {
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .empresa-option:active {
            background: #fef3c7;
            border-color: #F5A623;
        }

        .empresa-option-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .empresa-option-nit {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .login-footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 20px;
            line-height: 1.6;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 20px; }
            .login-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../assets/logo.png" class="login-logo-img" alt="Logo">
                <div class="login-title">Inventario App</div>
                <div class="login-subtitle">Sistema de Gestión</div>
            </div>

            <form class="login-form" onsubmit="iniciarSesion(event)">
                <div class="login-error" id="loginError"></div>

                <div class="form-group">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-input" type="text" id="usuario" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="clave">Contraseña</label>
                    <input class="form-input" type="password" id="clave" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <div class="login-options">
                    <span class="login-options-label">Modo Oscuro</span>
                    <label class="theme-switch">
                        <input type="checkbox" onchange="cambiarTema()">
                        <span class="theme-slider"></span>
                    </label>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>

                <div id="empresaSelector"></div>
            </form>

            <div class="login-footer">Sistema de Gestión v1.11.0</div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        const API_BASE = 'https://inventario-app-production-e8c8.up.railway.app/api';

        // ── Auto-login: intenta entrar automáticamente si hay credenciales guardadas ──
        window.addEventListener('load', async () => {
            const saved = getSavedCredentials();
            if (saved) {
                document.getElementById('usuario').value = saved.u;
                document.getElementById('clave').value   = saved.p;
                const btn = document.getElementById('btnLogin');
                btn.textContent = 'Entrando…';
                btn.disabled = true;
                const ok = await doLogin(saved.u, saved.p);
                if (!ok) {
                    // credenciales ya no son válidas, limpiar y dejar que el usuario reingrese
                    clearSavedCredentials();
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                }
            }
        });

        function getSavedCredentials() {
            try {
                const raw = localStorage.getItem('_rm_creds');
                return raw ? JSON.parse(atob(raw)) : null;
            } catch { return null; }
        }

        function saveCredentials(u, p) {
            localStorage.setItem('_rm_creds', btoa(JSON.stringify({ u, p })));
        }

        function clearSavedCredentials() {
            localStorage.removeItem('_rm_creds');
        }

        function mostrarError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function ocultarError() {
            document.getElementById('loginError').style.display = 'none';
        }

        async function doLogin(usuario, clave) {
            try {
                const res  = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.data));
                    saveCredentials(usuario, clave);

                    if (data.data.requiere_seleccion && data.data.empresas.length > 1) {
                        mostrarSelectorEmpresas(data.data.empresas);
                    } else {
                        const empresa = data.data.empresas[0].empresa;
                        localStorage.setItem('empresaActual', empresa);
                        window.location.href = 'principal.html';
                    }
                    return true;
                } else {
                    mostrarError(data.error || 'Usuario o contraseña incorrectos');
                    return false;
                }
            } catch (err) {
                console.error(err);
                mostrarError('Error de conexión. Verifica tu internet.');
                return false;
            }
        }

        async function iniciarSesion(event) {
            event.preventDefault();
            ocultarError();

            const btn     = document.getElementById('btnLogin');
            const usuario = document.getElementById('usuario').value.trim();
            const clave   = document.getElementById('clave').value;

            btn.textContent = 'Iniciando…';
            btn.disabled = true;

            await doLogin(usuario, clave);

            btn.textContent = 'Iniciar Sesión';
            btn.disabled = false;
        }

        function mostrarSelectorEmpresas(empresas) {
            const sel = document.getElementById('empresaSelector');
            sel.style.display = 'block';
            sel.innerHTML = `
                <label class="empresa-selector-label">Selecciona una empresa</label>
                ${empresas.map(emp => `
                    <div class="empresa-option" onclick="seleccionarEmpresa('${emp.empresa}')">
                        <span class="empresa-option-name">${emp.empresa_nombre}</span>
                        <span class="empresa-option-nit">NIT: ${emp.empresa}</span>
                    </div>
                `).join('')}
            `;
        }

        function seleccionarEmpresa(empresa) {
            localStorage.setItem('empresaActual', empresa);
            window.location.href = 'principal.html';
        }
    </script>
</body>
</html>
