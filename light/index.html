<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario App - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.5s ease both;
        }

        .login-card {
            background: #111111;
            border-radius: 20px;
            padding: 40px 28px 32px;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }

        /* Logo */
        .login-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .login-logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 18px;
            margin-bottom: 14px;
            filter: drop-shadow(0 8px 20px rgba(245,166,35,0.3));
        }

        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #F5A623;
            font-weight: 500;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .form-input {
            height: 48px;
            padding: 0 14px;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: #1a1a1a;
            color: #ffffff;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .form-input::placeholder { color: rgba(255,255,255,0.2); }

        .form-input:focus {
            outline: none;
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245,166,35,0.12);
        }

        /* Empresa selector */
        #empresaSelector {
            display: none;
        }

        .empresa-selector-label {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: block;
        }

        .empresa-option {
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: #1a1a1a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .empresa-option:active {
            background: rgba(245,166,35,0.12);
            border-color: #F5A623;
        }

        .empresa-option-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .empresa-option-nit {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 3px;
        }

        /* Error */
        .login-error {
            display: none;
            padding: 12px 14px;
            background: rgba(239,68,68,0.12);
            color: #f87171;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(239,68,68,0.2);
        }

        /* Botón */
        .btn-login {
            height: 50px;
            background: #F5A623;
            color: #111111;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            box-shadow: 0 6px 24px rgba(245,166,35,0.3);
            margin-top: 4px;
        }

        .btn-login:active {
            background: #E09217;
            transform: scale(0.98);
            box-shadow: 0 3px 12px rgba(245,166,35,0.2);
        }

        .btn-login:disabled {
            opacity: 0.6;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            margin-top: 24px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 20px 28px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo-wrap">
                <img src="../assets/logo.png" class="login-logo-img" alt="Logo">
                <div class="login-title">Inventario App</div>
                <div class="login-subtitle">Sistema de Gestión</div>
            </div>

            <form class="login-form" onsubmit="iniciarSesion(event)">
                <div class="login-error" id="loginError"></div>

                <div class="form-group">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-input" type="text" id="usuario" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="clave">Contraseña</label>
                    <input class="form-input" type="password" id="clave" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>

                <div id="empresaSelector"></div>
            </form>

            <div class="login-footer">Sistema de Gestión v1.11.0</div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://inventario-app-production-e8c8.up.railway.app/api';

        window.addEventListener('load', async () => {
            const saved = getSavedCredentials();
            if (saved) {
                document.getElementById('usuario').value = saved.u;
                document.getElementById('clave').value   = saved.p;
                const btn = document.getElementById('btnLogin');
                btn.textContent = 'Entrando…';
                btn.disabled = true;
                const ok = await doLogin(saved.u, saved.p);
                // Se reactiva siempre que la página siga aquí: si doLogin()
                // navegó (login directo, una sola empresa) esto ya no importa
                // porque la página se está descargando. Si falló, o si mostró
                // el selector de empresas (varias empresas, sin navegar), el
                // botón debe quedar disponible para que el usuario pueda
                // intentar con otras credenciales.
                if (!ok) clearSavedCredentials();
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            }
        });

        function getSavedCredentials() {
            try {
                const raw = localStorage.getItem('_rm_creds');
                return raw ? JSON.parse(atob(raw)) : null;
            } catch { return null; }
        }

        function saveCredentials(u, p) {
            localStorage.setItem('_rm_creds', btoa(JSON.stringify({ u, p })));
        }

        function clearSavedCredentials() {
            localStorage.removeItem('_rm_creds');
        }

        function mostrarError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function ocultarError() {
            document.getElementById('loginError').style.display = 'none';
        }

        async function doLogin(usuario, clave) {
            try {
                const res  = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.data));
                    saveCredentials(usuario, clave);

                    if (data.data.requiere_seleccion && data.data.empresas.length > 1) {
                        mostrarSelectorEmpresas(data.data.empresas);
                    } else {
                        const empresa = data.data.empresas[0].empresa;
                        localStorage.setItem('empresaActual', empresa);
                        window.location.href = 'principal.html';
                    }
                    return true;
                } else {
                    mostrarError(data.error || 'Usuario o contraseña incorrectos');
                    return false;
                }
            } catch (err) {
                console.error(err);
                mostrarError('Error de conexión. Verifica tu internet.');
                return false;
            }
        }

        async function iniciarSesion(event) {
            event.preventDefault();
            ocultarError();
            document.getElementById('empresaSelector').innerHTML = '';

            const btn     = document.getElementById('btnLogin');
            const usuario = document.getElementById('usuario').value.trim();
            const clave   = document.getElementById('clave').value;

            btn.textContent = 'Iniciando…';
            btn.disabled = true;

            await doLogin(usuario, clave);

            btn.textContent = 'Iniciar Sesión';
            btn.disabled = false;
        }

        function mostrarSelectorEmpresas(empresas) {
            const sel = document.getElementById('empresaSelector');
            sel.style.display = 'block';
            sel.innerHTML = `
                <label class="empresa-selector-label">Selecciona una empresa</label>
                ${empresas.map(emp => `
                    <div class="empresa-option" onclick="seleccionarEmpresa('${emp.empresa}')">
                        <span class="empresa-option-name">${emp.empresa_nombre}</span>
                        <span class="empresa-option-nit">NIT: ${emp.empresa}</span>
                    </div>
                `).join('')}
            `;
        }

        function seleccionarEmpresa(empresa) {
            localStorage.setItem('empresaActual', empresa);
            window.location.href = 'principal.html';
        }
    </script>
</body>
</html>
