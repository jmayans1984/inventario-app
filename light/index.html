<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        }

        .login-card {
            background: var(--bg-primary);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 24px rgba(0,122,255,0.35);
        }

        .login-logo-icon svg { width: 36px; height: 36px; }

        .login-logo-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .login-logo-sub {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input {
            height: 48px;
            padding: 0 16px;
            border: 1.5px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
            background: var(--bg-primary);
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }

        .login-options-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .btn-login {
            height: 50px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.2px;
            transition: transform 0.12s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-login:active {
            background: var(--accent-hover);
            transform: scale(0.97);
        }

        /* Error message */
        .login-error {
            display: none;
            padding: 12px 14px;
            background: var(--danger-light);
            color: var(--danger);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Company selector */
        #empresaSelector {
            display: none;
            margin-top: 4px;
        }

        .empresa-selector-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empresa-option {
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .empresa-option:active {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .empresa-option-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .empresa-option-nit {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* Dark mode override for this page */
        [data-theme="dark"] .login-card { background: var(--bg-secondary); }
        [data-theme="dark"] .form-input { background: var(--bg-tertiary); }
        [data-theme="dark"] .empresa-option { background: var(--bg-tertiary); }
    </style>
</head>
<body>
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="20" width="6" height="12" rx="2" fill="white" opacity="0.6"/>
                    <rect x="13" y="14" width="6" height="18" rx="2" fill="white" opacity="0.8"/>
                    <rect x="22" y="8" width="6" height="24" rx="2" fill="white"/>
                    <path d="M6 12L13 7L20 10L30 4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
                </svg>
            </div>
            <div class="login-logo-title">RestManager Pro</div>
            <div class="login-logo-sub">Sistema de Gestión</div>
        </div>

        <form class="login-form" onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label class="form-label" for="usuario">Usuario</label>
                <input class="form-input" type="text" id="usuario" placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="clave">Contraseña</label>
                <input class="form-input" type="password" id="clave" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            </div>

            <div class="login-options">
                <span class="login-options-label">Modo Oscuro</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
            </div>

            <div class="login-error" id="loginError"></div>

            <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>

            <div id="empresaSelector"></div>
        </form>

        <div class="login-footer">Sistema de Gestión v2.0</div>
    </div>

    <script src="theme.js"></script>
    <script>
        const API_BASE = 'https://inventario-app-production-e8c8.up.railway.app/api';

        function mostrarError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function ocultarError() {
            document.getElementById('loginError').style.display = 'none';
        }

        async function iniciarSesion(event) {
            event.preventDefault();
            ocultarError();

            const btn      = document.getElementById('btnLogin');
            const usuario  = document.getElementById('usuario').value.trim();
            const clave    = document.getElementById('clave').value;

            btn.textContent = 'Iniciando…';
            btn.disabled = true;

            try {
                const res  = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.data));

                    if (data.data.requiere_seleccion && data.data.empresas.length > 1) {
                        mostrarSelectorEmpresas(data.data.empresas);
                    } else {
                        const empresa = data.data.empresas[0].empresa;
                        localStorage.setItem('empresaActual', empresa);
                        window.location.href = 'principal.html';
                    }
                } else {
                    mostrarError(data.error || 'Usuario o contraseña incorrectos');
                }
            } catch (err) {
                console.error(err);
                mostrarError('Error de conexión. Verifica tu internet.');
            } finally {
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            }
        }

        function mostrarSelectorEmpresas(empresas) {
            const sel = document.getElementById('empresaSelector');
            sel.style.display = 'block';
            sel.innerHTML = `
                <div class="empresa-selector-label">Selecciona una empresa</div>
                ${empresas.map(emp => `
                    <div class="empresa-option" onclick="seleccionarEmpresa('${emp.empresa}')">
                        <span class="empresa-option-name">${emp.empresa_nombre}</span>
                        <span class="empresa-option-nit">NIT: ${emp.empresa}</span>
                    </div>
                `).join('')}
            `;
        }

        function seleccionarEmpresa(empresa) {
            localStorage.setItem('empresaActual', empresa);
            window.location.href = 'principal.html';
        }
    </script>
</body>
</html>
