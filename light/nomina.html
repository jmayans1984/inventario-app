<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nómina - RestManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Oculto hasta que permisos.js confirme el acceso: evita el parpadeo
           de ver el menú completo por una fracción de segundo y que luego
           desaparezcan ítems. */
        [data-permiso] { visibility: hidden; }
    </style>
</head>
<body>
    <!-- Top bar injected by header.js -->

    <!-- Hero -->
    <div class="mod-hero mod-hero-nomina">
        <div class="mod-hero-icon">👥</div>
        <div class="mod-hero-title">Nómina</div>
        <div class="mod-hero-sub">Horarios, liquidación y recibos</div>
    </div>

    <div class="page-content">

        <!-- PROCESOS -->
        <div class="section-label">Procesos</div>
        <div class="section-group">
            <a class="section-item" href="nomina-horario-semanal.html" data-permiso="/nomina/procesos/horario">
                <div class="item-icon icon-violet"><i data-icono="calendario"></i></div>
                <div class="item-body">
                    <div class="item-name">Horario Semanal</div>
                    <div class="item-desc">Turnos por centro de costo y empleado</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="section-item" href="nomina-liquidacion.html" data-permiso="/nomina/procesos/liquidacion">
                <div class="item-icon icon-violet"><i data-icono="calculadora"></i></div>
                <div class="item-body">
                    <div class="item-name">Liquidación de Nómina</div>
                    <div class="item-desc">Calcular y aprobar pagos semanales</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

        <!-- INFORMES -->
        <div class="section-label">Informes</div>
        <div class="section-group">
            <a class="section-item" href="nomina-reporte-horario.html" data-permiso="/nomina/reportes/horario">
                <div class="item-icon icon-violet"><i data-icono="reloj"></i></div>
                <div class="item-body">
                    <div class="item-name">Horario para Publicar</div>
                    <div class="item-desc">Una hoja por centro de costo</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="section-item" href="nomina-recibos.html" data-permiso="/nomina/reportes/recibos">
                <div class="item-icon icon-violet"><i data-icono="recibo"></i></div>
                <div class="item-body">
                    <div class="item-name">Recibos de Pago</div>
                    <div class="item-desc">Pay stubs por empleado</div>
                </div>
                <svg class="item-chevron" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>

    </div>

    <script src="iconos.js"></script>
    <script src="theme.js"></script>
    <script src="campo-fecha.js"></script>
    <script src="header.js"></script>
    <script src="permisos.js"></script>
</body>
</html>
