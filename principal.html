<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .welcome-section h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .welcome-section p {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- HEADER UNIVERSAL -->
    <header class="header">
        <div class="header-info">
            <div class="user-info">
                <span class="user-name" id="userName">👤 Usuario</span>
                <span class="empresa-info">| 🏢 <span id="empresaCode">-</span></span>
            </div>
            <div class="theme-switch-container">
                <span class="theme-label">🌙</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-label">☀️</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </header>

    <div class="container">
        <div class="welcome-section">
            <h1>Bienvenido al Sistema</h1>
            <p>Selecciona un módulo para comenzar</p>
        </div>

        <div class="menu-grid">
            <div class="menu-item" onclick="window.location.href='almacen.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
                <h3>Almacén</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Gestión de inventario y movimientos</p>
            </div>

            <div class="menu-item" onclick="window.location.href='contabilidad.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📊</div>
                <h3>Contabilidad</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Gastos y reportes contables</p>
            </div>

            <div class="menu-item" onclick="window.location.href='tesoreria.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">💰</div>
                <h3>Tesorería</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Bancos, movimientos y facturas</p>
            </div>

            <div class="menu-item" onclick="window.location.href='ordenes-recepcion.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📋</div>
                <h3>Recepción Órdenes</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Recibir y procesar órdenes</p>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        // Verificar sesión
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        const empresa = localStorage.getItem('empresaActual');

        if (!usuario || !empresa) {
            window.location.href = 'index.html';
        }

        // Mostrar datos del usuario
        document.getElementById('userName').textContent = `👤 ${usuario.nombre}`;
        document.getElementById('empresaCode').textContent = empresa;

        // Función para cerrar sesión
        function cerrarSesion() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('usuario');
                localStorage.removeItem('empresaActual');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
