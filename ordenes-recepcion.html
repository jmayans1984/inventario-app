<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Recepción de Órdenes</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #232340;
            --text: #e0e7ff;
            --text-secondary: #94a3b8;
            --border: #2d2d44;
            --accent: #a78bfa;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
        }

        .header {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .ordenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .orden-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .orden-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
        }

        .orden-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .orden-codigo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .orden-estado {
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .estado-pendiente {
            background: var(--warning);
            color: #000;
        }

        .estado-recibida {
            background: var(--success);
            color: white;
        }

        .orden-info {
            margin-bottom: 1rem;
        }

        .orden-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .orden-info-label {
            color: var(--text-secondary);
        }

        .orden-info-value {
            font-weight: 600;
        }

        .orden-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            flex: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .detalle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .detalle-section {
            background: var(--bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .detalle-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            background: var(--bg);
            padding: 0.75rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: var(--bg-card-hover);
        }

        .upload-zone.dragging {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        #preview {
            max-width: 100%;
            margin-top: 1rem;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .detalle-grid {
                grid-template-columns: 1fr;
            }

            .ordenes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Recepción de Órdenes</h1>
        <button class="btn btn-secondary" onclick="window.location.href='almacen.html'">
            ← Volver al Almacén
        </button>
    </div>

    <div class="ordenes-grid" id="ordenesGrid">
        <!-- Se llenan con JS -->
    </div>

    <!-- Modal de detalle -->
    <div class="modal" id="modalDetalle">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Orden de Compra <span id="modalOrdenCodigo"></span></h2>
                <button class="btn btn-secondary" onclick="cerrarModal()">❌ Cerrar</button>
            </div>

            <div class="detalle-grid">
                <!-- Información de la orden -->
                <div class="detalle-section">
                    <div class="detalle-title">📋 Información General</div>
                    <div id="infoGeneral"></div>
                </div>

                <!-- Subir soporte -->
                <div class="detalle-section">
                    <div class="detalle-title">📸 Soporte de Entrega</div>
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📷</div>
                        <p style="font-weight: 600; margin-bottom: 0.5rem;">Click para subir foto</p>
                        <p style="font-size: 0.85rem; color: var(--text-secondary);">o arrastra una imagen aquí</p>
                        <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">JPG, PNG o PDF (máx 10MB)</p>
                    </div>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" style="display: none;" onchange="subirSoporte(event)">
                    <canvas id="preview" style="display: none;"></canvas>
                    <div id="soporteActual"></div>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="detalle-section" style="grid-column: 1 / -1;">
                <div class="detalle-title">📦 Productos de la Orden</div>
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th style="text-align: right;">Cantidad</th>
                            <th style="text-align: right;">Precio</th>
                            <th style="text-align: right;">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                    </tbody>
                </table>
            </div>

            <!-- Checkbox Entrega Completa -->
            <div style="background: var(--bg); padding: 1rem; border-radius: 8px; margin-top: 1.5rem; border: 2px solid var(--border);">
                <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="checkEntregaCompleta" checked style="width: 20px; height: 20px; cursor: pointer;">
                    <span style="font-weight: 600; font-size: 1rem; color: var(--text);">
                        ENTREGA COMPLETA
                    </span>
                </label>
            </div>

            <!-- Acciones -->
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-success" onclick="marcarRecibida()" id="btnMarcarRecibida">
                    ✅ Confirmar Recepción
                </button>
            </div>
        </div>
    </div>

    <script src="ordenes-recepcion.js"></script>
</body>
</html>
