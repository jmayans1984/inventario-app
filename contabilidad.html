<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilidad - Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER UNIVERSAL -->
    <header class="header">
        <div class="header-info">
            <div class="user-info">
                <span class="user-name" id="userName">👤 Usuario</span>
                <span class="empresa-info">| 🏢 <span id="empresaCode">-</span></span>
            </div>
            <div class="theme-switch-container">
                <span class="theme-label">🌙</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-label">☀️</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="window.location.href='principal.html'">
                ≡ Menú Principal
            </button>
            <button class="btn-header" onclick="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--text-primary);">📊 Contabilidad</h1>
            <p style="color: var(--text-secondary);">Gestión de gastos y reportes contables</p>
        </div>

        <div class="menu-grid">
            <div class="menu-item" onclick="window.location.href='contabilidad-gastos.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">💰</div>
                <h3>Crear Gasto</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Registrar nuevos gastos</p>
            </div>

            <div class="menu-item" onclick="window.location.href='contabilidad-reportes.html'">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📈</div>
                <h3>Reporte de Gastos</h3>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;">Ver y filtrar gastos</p>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        // Verificar sesión
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        const empresa = localStorage.getItem('empresaActual');

        if (!usuario || !empresa) {
            window.location.href = 'index.html';
        }

        // Mostrar datos del usuario
        document.getElementById('userName').textContent = `👤 ${usuario.nombre}`;
        document.getElementById('empresaCode').textContent = empresa;

        // Objeto de sesión global
        const sesion = {
            usuario: usuario.usuario,
            nombre: usuario.nombre,
            empresa: empresa
        };

        // Función para cerrar sesión
        function cerrarSesion() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('usuario');
                localStorage.removeItem('empresaActual');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
