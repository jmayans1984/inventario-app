<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER UNIVERSAL -->
    <header class="header">
        <div class="header-info">
            <div class="user-info">
                <span class="user-name" id="userName">👤 Usuario</span>
                <span class="empresa-info">| 🏢 <span id="empresaCode">-</span></span>
            </div>
            <div class="theme-switch-container">
                <span class="theme-label">🌙</span>
                <label class="theme-switch">
                    <input type="checkbox" onchange="cambiarTema()">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-label">☀️</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="window.location.href='principal.html'">
                ≡ Menú Principal
            </button>
            <button class="btn-header" onclick="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- CONTENIDO DEL MÓDULO -->
    <div style="padding: 1rem;">
        <h1 style="margin-bottom: 2rem; color: var(--text-primary);">📦 Almacén</h1>

        <!-- Aquí va el contenido del módulo -->
        <div class="menu-grid">
            <div class="menu-item" onclick="window.location.href='almacen-gestion.html'">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">📝</div>
                <h3>Gestión Inventario</h3>
            </div>

            <div class="menu-item" onclick="window.location.href='almacen-inventario.html'">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">📋</div>
                <h3>Ver Inventario</h3>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        // Verificar sesión
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        const empresa = localStorage.getItem('empresaActual');

        if (!usuario || !empresa) {
            window.location.href = 'index.html';
        }

        // Mostrar datos del usuario en el header
        document.getElementById('userName').textContent = `👤 ${usuario.nombre}`;
        document.getElementById('empresaCode').textContent = empresa;

        // Función para cerrar sesión
        function cerrarSesion() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('usuario');
                localStorage.removeItem('empresaActual');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
