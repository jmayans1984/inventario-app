<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="version" content="2.2" />
    <title>RestManager Pro - Sistema ERP Completo</title>
    <meta name="description" content="Sistema integral de gestión empresarial" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js?v=1750153400000"></script>
    <script>
      (function(){
        var v='2.2';
        if(localStorage.getItem('_appv')!==v){
          fetch(location.href,{cache:'no-store'}).then(function(r){return r.text()}).then(function(html){
            if(html.indexOf('content="'+v+'"')<0)return;
            localStorage.setItem('_appv',v);
            location.reload(true);
          });
        }
      })();
    </script>
  </body>
</html>
